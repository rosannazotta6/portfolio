<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosanna Zotta — Digital Product Manager Junior</title>
  <meta name="description" content="Portfolio di Rosanna Zotta — Digital Product Manager Junior. Tre anni di publishing digitale al Gruppo Monrif: newsletter, prodotti editoriali, UX, app, eventi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portfolio.css?v=12">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <nav class="nav">
      <a class="brand" href="#top">RZ</a>

      <ul class="nav-links" id="nav-links">
        <li><a id="nav-about" href="#about">About</a></li>
        <li><a id="nav-work" href="#work">Progetti</a></li>
        <li><a id="nav-skills" href="#skills">Skills</a></li>
        <li><a id="nav-contact" href="#contact">Contatti</a></li>
      </ul>

      <div class="nav-right">
        <div class="lang-switch">
          <button data-lang="it" class="active">IT</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
      </div>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero" id="top">
    <div class="hero-inner">
      <span class="hero-eyebrow" id="hero-eyebrow">Portfolio · 2026</span>
      <h1 class="hero-name" id="hero-name">Ciao, sono Rosanna <em class="hero-wave">👋</em></h1>
      <p class="hero-role" id="hero-role">Digital Product Manager Junior &amp; Innovation Enthusiast</p>
      <p class="hero-intro" id="hero-intro"></p>
      <div class="hero-cta">
        <a href="#contact" class="btn btn-primary" id="hero-cta-talk">
          Parliamone
          <span class="arr">→</span>
        </a>
        <a href="Rosanna_Zotta_CV.pdf" download class="btn btn-ghost" id="hero-cta-cv">
          Scarica CV
          <span class="arr">↓</span>
        </a>
      </div>
    </div>
  </section>

  <!-- STATS STRIP -->
  <div class="stats-strip" id="hero-stats"></div>

  <!-- ABOUT -->
  <section class="section" id="about">
    <div class="section-head">
      <span class="section-eyebrow" id="about-eyebrow"></span>
      <h2 class="section-title" id="about-title"></h2>
    </div>
    <div class="about-grid">
      <div class="about-text" id="about-text"></div>
      <dl class="about-side" id="about-side"></dl>
    </div>
  </section>

  <!-- WORK -->
  <div class="work-bg">
    <section class="section" id="work">
      <div class="section-head">
        <span class="section-eyebrow" id="work-eyebrow"></span>
        <h2 class="section-title" id="work-title"></h2>
        <p class="section-desc" id="work-desc"></p>
      </div>

      <div class="filter-bar" id="filter-bar">
        <div class="filter-row" id="filter-cat-row"></div>
      </div>

      <div class="categories" id="categories"></div>
    </section>
  </div>

  <!-- SKILLS -->
  <div class="skills-bg">
    <section class="section" id="skills">
      <div class="section-head">
        <span class="section-eyebrow" id="skills-eyebrow"></span>
        <h2 class="section-title" id="skills-title"></h2>
      </div>
      <div class="skills-grid" id="skills-grid"></div>
    </section>
  </div>

  <!-- CONTACT -->
  <section class="contact" id="contact">
    <div class="contact-inner">
      <div class="section-head">
        <span class="section-eyebrow" id="contact-eyebrow"></span>
        <h2 class="section-title" id="contact-title"></h2>
      </div>
      <p class="contact-lead" id="contact-lead"></p>
      <div class="contact-links" id="contact-links"></div>
    </div>
  </section>

  <footer class="footer">
    <p>© 2026 Rosanna Zotta · Tutti i diritti riservati · Made with 💖</p>
  </footer>

  <button class="back-to-top" id="back-to-top" aria-label="Torna su">↑</button>

  <!-- DRAWER -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <header class="drawer-head">
      <div class="drawer-cat">
        <span class="drawer-cat-dot" id="drawer-cat-dot"></span>
        <span id="drawer-cat-name"></span>
      </div>
      <button class="drawer-close" id="drawer-close" aria-label="Chiudi">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 3L13 13M13 3L3 13" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="projects-data.js?v=10"></script>
  <script src="portfolio-app.js?v=10"></script>
</body>
</html>
